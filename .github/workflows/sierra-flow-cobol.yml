name: Sierra Flow - Daily Batch

on:
  schedule:
    - cron: '17 14 * * *'    # 14:17 UTC = 7:17 AM PDT / 6:17 AM PST (GitHub often starts it later)
  workflow_dispatch:
    inputs:
      rebuild_normals:
        description: Rebuild normals.csv from 30 years of USGS history
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths: [ '*.cob', 'fetch_usgs.py', 'sites.csv', 'run_job.sh', '.github/workflows/sierra-flow-cobol.yml' ]

permissions:
  contents: write

concurrency:
  group: sierra-flow-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-24.04          # pinned: gnucobol3 3.1.2 from Ubuntu noble
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnucobol3 bc > /dev/null && cobc --version | head -1

      - name: Run the batch job
        run: ./run_job.sh ${{ inputs.rebuild_normals && '--normals' || '' }}

      - name: Job log
        if: always()
        run: cat job-log.txt || true

      - name: Report
        run: cat streamflow-report.txt

      - name: Commit the outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streamflow.csv streamflow-report.txt results.csv job-log.txt normals.csv normals-log.txt
          if git diff --staged --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "data: daily batch $(date -u '+%Y-%m-%d') [skip ci]"
          git pull -q --rebase && git push -q
